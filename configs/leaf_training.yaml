seed: 42

dataset:
  name: PlantCLEF2015Leaf
  root: data/plantclef2015/leaf
  metadata: data/plantclef2015/metadata_split.csv
  image_column: image_path
  family_column: family
  genus_column: genus
  species_column: species

views:
  global:
    image_size: 224
  local:
    image_size: 224
    crop_size: 32
    crop_position: center

pair_sampling:
  positive_per_epoch:
    genus: 2000
    species: 4000
  negative_per_epoch:
    genus: 3000
    species: 6000
  hard_negative_ratio: 0.5

model:
  backbone: vgg16
  pretrained: true
  embedding_dim: 4096
  distance: l1

training:
  batch_size: 32
  dynamic_pairs: true
  epochs: 30
  num_workers: 2
  optimizer: sgd
  learning_rate: 0.001
  momentum: 0.9
  lr_decay_step: 512
  lr_decay_gamma: 0.5
  split: train

evaluation:
  enabled: true
  max_species: 120
  references_per_genus: 4
  queries_per_genus: 2
  split: val
  top_k: [1, 3, 5]

inference:
  references_per_class: 6
  genus_candidates: 30
  top_k: 5
