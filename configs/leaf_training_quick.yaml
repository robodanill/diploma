seed: 42

dataset:
  name: PlantCLEF2015LeafQuick
  root: data/plantclef2015/leaf
  metadata: data/plantclef2015/metadata_split.csv
  image_column: image_path
  family_column: family
  genus_column: genus
  species_column: species
  subset:
    max_species: 60
    min_images_per_species: 4
    max_images_per_species: 8

views:
  global:
    image_size: 224
  local:
    image_size: 224
    crop_size: 32
    crop_position: center

pair_sampling:
  positive_per_epoch:
    genus: 120
    species: 240
  negative_per_epoch:
    genus: 180
    species: 360

model:
  backbone: vgg16
  pretrained: true
  embedding_dim: 4096
  distance: l1

training:
  batch_size: 16
  dynamic_pairs: true
  epochs: 3
  num_workers: 0
  progress_every_batches: 1
  optimizer: sgd
  learning_rate: 0.001
  momentum: 0.9
  lr_decay_step: 512
  lr_decay_gamma: 0.5
  split: train

evaluation:
  enabled: false
  max_species: 60
  references_per_genus: 2
  queries_per_genus: 2
  split: val
  top_k: [1, 3, 5]

inference:
  references_per_class: 2
  genus_candidates: 10
  top_k: 5
