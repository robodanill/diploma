seed: 42

dataset:
  name: PlantCLEF2015LeafScanPaper60
  root: data/plantclef2015/leafscan
  metadata: data/plantclef2015/leafscan_paper60_metadata.csv
  image_column: image_path
  family_column: family
  genus_column: genus
  species_column: species
  subset:
    min_images_per_species: 6
    max_images_per_species: 6
    seed: 42

views:
  global:
    image_size: 224
  local:
    image_size: 224
    crop_size: 32
    crop_position: center

preprocessing:
  enabled: true
  leaf_bbox: true

pair_sampling:
  strategy: pair_uniform
  positive_per_epoch:
    genus: 400
    species: 800
  negative_per_epoch:
    genus: 600
    species: 1200
  hard_negative_ratio:
    genus: 0.0
    species: 0.60
  targeted_negative_ratio:
    genus: 0.05
    species: 0.0
  targeted_negative_label_pairs:
    genus:
      - [Fraxinus, Acer]
      - [Fraxinus, Viburnum]
      - [Ailanthus, Acer]
      - [Betula, Acer]
      - [Corylus, Betula]
      - [Crataegus, Sorbus]
      - [Lippia, Prunus]
      - [Populus, Salix]
      - [Platanus, Acer]
      - [Viburnum, Acer]

model:
  backbone: vgg16
  pretrained: true
  embedding_dim: 4096
  distance: l1

training:
  batch_size: 32
  dynamic_pairs: true
  epochs: 96
  max_iterations: 4096
  num_workers: 2
  optimizer: sgd
  learning_rate: 0.001
  momentum: 0.9
  lr_decay_step: 512
  lr_decay_gamma: 0.5
  split: train

evaluation:
  enabled: true
  source: train_subset
  references_per_genus: 2
  queries_per_genus: 2
  top_k: [5, 15]
  score_mode: l1

inference:
  references_per_class: 6
  reference_split: train
  genus_candidates: 30
  top_k: 5
