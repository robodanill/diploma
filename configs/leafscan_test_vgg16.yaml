dataset:
  name: PlantCLEF2015LeafScanTestVGG16
  root: data/plantclef2015/test_leafscan/leafscan
  metadata: data/plantclef2015/test_leafscan_metadata.csv
  image_column: image_path
  family_column: family
  genus_column: genus
  species_column: species

views:
  global:
    image_size: 224
  local:
    image_size: 224
    crop_size: 32
    crop_position: center

preprocessing:
  enabled: true
  leaf_bbox: true

model:
  backbone: vgg16
  pretrained: true
  embedding_dim: 4096
  distance: l1
