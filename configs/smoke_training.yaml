seed: 42

dataset:
  name: PlantCLEF2015LeafSmoke
  root: data/plantclef2015/leaf
  metadata: data/plantclef2015/metadata.csv
  image_column: image_path
  family_column: family
  genus_column: genus
  species_column: species
  subset:
    max_species: 20
    min_images_per_species: 4
    max_images_per_species: 6

views:
  global:
    image_size: 224
  local:
    image_size: 224
    crop_size: 32
    crop_position: center

pair_sampling:
  positive_per_epoch:
    genus: 80
    species: 120
  negative_per_epoch:
    genus: 120
    species: 180

model:
  backbone: vgg16
  pretrained: true
  embedding_dim: 4096
  distance: l1

training:
  batch_size: 16
  dynamic_pairs: true
  epochs: 1
  num_workers: 2
  optimizer: sgd
  learning_rate: 0.001
  momentum: 0.9
  lr_decay_step: 512
  lr_decay_gamma: 0.5

inference:
  references_per_class: 2
  genus_candidates: 10
  top_k: 5
