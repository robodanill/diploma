[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-classifier"
version = "0.1.0"
description = "Plant image classification desktop application and training pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
]

[project.optional-dependencies]
app = [
    "PyQt6>=6.6",
]
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=0.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.5",
]

[project.scripts]
plant-classifier-app = "plant_classifier.app.main:main"
plant-classifier-build-index = "plant_classifier.training.build_index_cli:main"
plant-classifier-eval-classifier = "plant_classifier.training.eval_classifier_cli:main"
plant-classifier-eval-genus = "plant_classifier.training.eval_genus_cli:main"
plant-classifier-eval-species = "plant_classifier.training.eval_species_cli:main"
plant-classifier-prepare-plantclef = "plant_classifier.data.plantclef_cli:main"
plant-classifier-split-metadata = "plant_classifier.data.split_cli:main"
plant-classifier-train-classifier = "plant_classifier.training.classifier_cli:main"
plant-classifier-train = "plant_classifier.training.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
